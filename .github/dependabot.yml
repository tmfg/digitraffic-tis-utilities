version: 2
updates:
  # Keep Maven dependencies up to date
  - package-ecosystem: "maven"
    directories:
      - "/ecs-tasks/netex2gtfs-entur"
      - "/ecs-tasks/netex-entur"
      - "/ecs-tasks/gbfs-entur"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7 # Wait 7 days for any update
      semver-major-days: 14 # Wait 14 days for major version bumps
    groups:
      # Security fixes that are patch bumps: merge right away.
      # Minor and major security fixes are not grouped and open as individual PRs.
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
      # Patch and minor updates of all rules and of dev and prod dependencies in one PR.
      # Major updates are not listed, so they open as individual PRs.
      maven-deps:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          # The tool a rule wraps is the rule's version: its updates open separate PRs (all update types).
          - "org.entur:netex-validator-java"
          - "org.entur:netex-gtfs-converter-java"
          - "org.mobilitydata:gbfs-validator-java"
        update-types:
          - "minor"
          - "patch"
  # Keep Python dependencies up to date
  - package-ecosystem: "pip"
    directories:
      - "/ecs-tasks/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7 # Wait 7 days for any update
      semver-major-days: 14 # Wait 14 days for major version bumps
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
      # Patch and minor updates in one PR. Major updates are not listed, so they open as individual PRs.
      python-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # Keep Docker dependencies up to date
  - package-ecosystem: "docker"
    directories:
      - "/ecs-tasks/netex2gtfs-entur"
      - "/ecs-tasks/netex-entur"
      - "/ecs-tasks/gbfs-entur"
      - "/ecs-tasks/gtfs-canonical"
      - "/ecs-tasks/gtfs2netex-fintraffic"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7 # Wait 7 days for any update
    groups:
      # One PR for patch and minor image updates across all rule directories.
      # Major updates are not listed, so they open as individual PRs.
      docker-deps:
        patterns:
          - "*"
        exclude-patterns:
          # The GTFS validator image is the gtfs-canonical rule's version: its updates open a separate PR.
          - "ghcr.io/mobilitydata/gtfs-validator"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore updates to Java versions other than 21
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]
      # Ignore updates to Node versions other than 24
      - dependency-name: "node"
        update-types: [ "version-update:semver-major" ]
  # keep used GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7 # Wait 7 days for any update
    groups:
      actions-deps:
        patterns:
          - "*"
